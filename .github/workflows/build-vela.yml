name: Vela CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        os: [linux, windows]
        config: [Release, Debug]
        include:
          - os: linux
            runs-on: ubuntu-22.04
            generator: Ninja
          - os: windows
            runs-on: windows-2022
            generator: Ninja
    steps:
    - uses: actions/checkout@v6
    - name: Setup MSVC (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
    - name: Build ANARI-SDK
      uses: ./.github/actions/build-anari-sdk
      with:
        config: ${{ matrix.config }}
        install-prefix: ${{ github.workspace }}/deps
        build-deps-path: cmake/build_deps
        generator: Ninja
    - name: Configure Vela CMake
      run: >
        cmake -LA -G Ninja -B ${{ github.workspace }}/build
        -DCMAKE_PREFIX_PATH=${{ github.workspace }}/deps
        -DCMAKE_BUILD_TYPE=${{ matrix.config }}
        -DVSR_BUILD_APPS=ON
        -DVSR_BUILD_INTERACTIVE_APPS=OFF
        -DVSR_BUILD_UI_LIBRARY=OFF
        -DVSR_USE_ASSIMP=OFF
        -DVSR_USE_CUDA=OFF
        -DVSR_USE_HDF5=OFF
        -DVSR_USE_MPI=OFF
        -DVSR_USE_NETWORKING=OFF
        -DVSR_USE_OIIO=OFF
        -DVSR_USE_SDL3=OFF
        -DVSR_USE_SILO=OFF
        -DVSR_USE_TBB=OFF
        -DVSR_USE_TORCH=OFF
        -DVSR_USE_USD=OFF
        -DVSR_USE_VTK=OFF
        ${{ github.workspace }}
    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config ${{ matrix.config }}
    - name: Unit Tests
      working-directory: ${{ github.workspace }}/build
      run: ctest -C ${{ matrix.config }} --output-on-failure

  build-cuda:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        os: [linux, windows]
        cudaversion: ['12.4.1', '13.0.2']
        config: [Release, Debug]
        include:
          - os: linux
            runs-on: ubuntu-22.04
            generator: Ninja
          - os: windows
            runs-on: windows-2022
            generator: Ninja
    steps:
    - uses: actions/checkout@v6
    - name: Setup MSVC (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
    - name: Setup CUDA Toolkit
      uses: ./.github/actions/setup-cuda
      with:
        cuda-version: ${{ matrix.cudaversion }}
    - name: Build ANARI-SDK
      uses: ./.github/actions/build-anari-sdk
      with:
        config: ${{ matrix.config }}
        install-prefix: ${{ github.workspace }}/deps
        build-deps-path: cmake/build_deps
        generator: Ninja
    - name: Configure Vela CMake (CUDA)
      run: >
        cmake -LA -G Ninja -B ${{ github.workspace }}/build-cuda
        -DCMAKE_PREFIX_PATH=${{ github.workspace }}/deps
        -DCMAKE_BUILD_TYPE=${{ matrix.config }}
        -DVSR_BUILD_APPS=ON
        -DVSR_BUILD_INTERACTIVE_APPS=OFF
        -DVSR_BUILD_UI_LIBRARY=OFF
        -DVSR_USE_ASSIMP=OFF
        -DVSR_USE_CUDA=ON
        -DVSR_USE_HDF5=OFF
        -DVSR_USE_MPI=OFF
        -DVSR_USE_NETWORKING=OFF
        -DVSR_USE_OIIO=OFF
        -DVSR_USE_SDL3=OFF
        -DVSR_USE_SILO=OFF
        -DVSR_USE_TBB=OFF
        -DVSR_USE_TORCH=OFF
        -DVSR_USE_USD=OFF
        -DVSR_USE_VTK=OFF
        ${{ github.workspace }}
    - name: Build (CUDA)
      run: cmake --build ${{ github.workspace }}/build-cuda --config ${{ matrix.config }} --parallel
