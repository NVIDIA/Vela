name: Vela CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6
    # Pin the formatter: different clang-format releases format differently.
    # Files listed in .clang-format-ignore are skipped.
    - name: Install clang-format
      run: pip install clang-format==21.1.8
    - name: Check formatting
      run: >
        git ls-files 'src/*.cpp' 'src/*.hpp' 'src/*.h' 'src/*.cu' 'src/*.cuh'
        | xargs clang-format --dry-run --Werror

  build:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        os: [linux, windows]
        config: [Release, Debug]
        include:
          - os: linux
            runs-on: ubuntu-22.04
            generator: Ninja
          - os: windows
            runs-on: windows-2022
            generator: Ninja
    steps:
    - uses: actions/checkout@v6
    # Third-party sources (Lua, sol2, zlib, ...) are downloaded by
    # anari_sdk_fetch_project into <source>/.anari_deps and MD5-verified, so a
    # cache hit skips the network entirely and a stale entry just re-downloads.
    - name: Cache fetched dependency sources
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.anari_deps
        key: anari-deps-${{ runner.os }}-${{ hashFiles('external/**/CMakeLists.txt') }}
        restore-keys: anari-deps-${{ runner.os }}-
    - name: Setup MSVC (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
    - name: Build ANARI-SDK
      uses: ./.github/actions/build-anari-sdk
      with:
        config: ${{ matrix.config }}
        install-prefix: ${{ github.workspace }}/deps
        build-deps-path: cmake/build_deps
        generator: Ninja
    - name: Configure Vela CMake
      run: >
        cmake -LA -G Ninja -B ${{ github.workspace }}/build
        -DCMAKE_PREFIX_PATH=${{ github.workspace }}/deps
        -DCMAKE_BUILD_TYPE=${{ matrix.config }}
        -DVSR_BUILD_APPS=ON
        -DVSR_BUILD_INTERACTIVE_APPS=OFF
        -DVSR_BUILD_UI_LIBRARY=OFF
        -DVSR_USE_ASSIMP=OFF
        -DVSR_USE_CUDA=OFF
        -DVSR_USE_HDF5=OFF
        -DVSR_USE_MPI=OFF
        -DVSR_USE_NETWORKING=OFF
        -DVSR_USE_OIIO=OFF
        -DVSR_USE_SDL3=OFF
        -DVSR_USE_SILO=OFF
        -DVSR_USE_TBB=OFF
        -DVSR_USE_TORCH=OFF
        -DVSR_USE_USD=OFF
        -DVSR_USE_VTK=OFF
        ${{ github.workspace }}
    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config ${{ matrix.config }}
    # ANARI is installed in the dependency prefix, not the build tree, and
    # installed binaries carry no RPATH. Put its runtime on the loader search
    # path so device modules such as helide load and the staged vsrRender of
    # the install check can start.
    - name: Unit Tests (Windows)
      if: runner.os == 'Windows'
      working-directory: ${{ github.workspace }}/build
      shell: pwsh
      run: |
        $env:PATH = "${{ github.workspace }}\deps\bin;${{ github.workspace }}\deps\lib;$env:PATH"
        ctest -C ${{ matrix.config }} --output-on-failure
    - name: Unit Tests
      if: runner.os != 'Windows'
      working-directory: ${{ github.workspace }}/build
      shell: bash
      run: |
        export LD_LIBRARY_PATH="${{ github.workspace }}/deps/lib:$LD_LIBRARY_PATH"
        ctest -C ${{ matrix.config }} --output-on-failure

  build-cuda:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        os: [linux, windows]
        cudaversion: ['12.4.1', '13.0.2']
        config: [Release, Debug]
        include:
          - os: linux
            runs-on: ubuntu-22.04
            generator: Ninja
          - os: windows
            runs-on: windows-2022
            generator: Ninja
    steps:
    - uses: actions/checkout@v6
    # Third-party sources (Lua, sol2, zlib, ...) are downloaded by
    # anari_sdk_fetch_project into <source>/.anari_deps and MD5-verified, so a
    # cache hit skips the network entirely and a stale entry just re-downloads.
    - name: Cache fetched dependency sources
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.anari_deps
        key: anari-deps-${{ runner.os }}-${{ hashFiles('external/**/CMakeLists.txt') }}
        restore-keys: anari-deps-${{ runner.os }}-
    - name: Setup MSVC (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
    - name: Setup CUDA Toolkit
      uses: ./.github/actions/setup-cuda
      with:
        cuda-version: ${{ matrix.cudaversion }}
    - name: Build ANARI-SDK
      uses: ./.github/actions/build-anari-sdk
      with:
        config: ${{ matrix.config }}
        install-prefix: ${{ github.workspace }}/deps
        build-deps-path: cmake/build_deps
        generator: Ninja
    - name: Configure Vela CMake (CUDA)
      run: >
        cmake -LA -G Ninja -B ${{ github.workspace }}/build-cuda
        -DCMAKE_PREFIX_PATH=${{ github.workspace }}/deps
        -DCMAKE_BUILD_TYPE=${{ matrix.config }}
        -DVSR_BUILD_APPS=ON
        -DVSR_BUILD_INTERACTIVE_APPS=OFF
        -DVSR_BUILD_UI_LIBRARY=OFF
        -DVSR_USE_ASSIMP=OFF
        -DVSR_USE_CUDA=ON
        -DVSR_USE_HDF5=OFF
        -DVSR_USE_MPI=OFF
        -DVSR_USE_NETWORKING=OFF
        -DVSR_USE_OIIO=OFF
        -DVSR_USE_SDL3=OFF
        -DVSR_USE_SILO=OFF
        -DVSR_USE_TBB=OFF
        -DVSR_USE_TORCH=OFF
        -DVSR_USE_USD=OFF
        -DVSR_USE_VTK=OFF
        ${{ github.workspace }}
    - name: Build (CUDA)
      run: cmake --build ${{ github.workspace }}/build-cuda --config ${{ matrix.config }} --parallel
